<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geo Locator | MapTiler</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #0b1020;
    --accent: #00e5ff;
    --accent2: #a855f7;
    --accent3: #ff4d8d;
    --glass: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.14);
    --text: #eaf2ff;
    --muted: #8fa3c7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Space Grotesk", sans-serif;
    color: var(--text);
    background: var(--bg1);
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }

  /* ===== Background blobs ===== */
  .blob {
    position: fixed; border-radius: 50%; filter: blur(90px);
    opacity: .45; z-index: 0; animation: float 14s ease-in-out infinite;
  }
  .b1 { width: 420px; height: 420px; background: var(--accent2); top: -120px; left: -100px; }
  .b2 { width: 380px; height: 380px; background: var(--accent); bottom: -120px; right: -80px; animation-delay: -5s; }
  .b3 { width: 300px; height: 300px; background: var(--accent3); top: 45%; left: 55%; animation-delay: -9s; opacity: .25; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px,-50px) scale(1.15); }
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at center, #000 30%, transparent 80%);
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 760px; }

  /* ===== Header ===== */
  header { text-align: center; margin-bottom: 26px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    font-family: "JetBrains Mono", monospace; font-size: 12.5px; color: var(--accent);
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #22ff88; box-shadow: 0 0 10px #22ff88; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; transform: scale(.7); } }
  h1 {
    margin-top: 16px; font-size: clamp(34px, 7vw, 56px); font-weight: 700; letter-spacing: -1.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
    background-size: 250% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 250% center; } }
  header p { color: var(--muted); margin-top: 6px; }

  /* ===== Card ===== */
  .card {
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 24px; padding: 26px; backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }

  /* ===== Search ===== */
  .search { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 200px; position: relative; }
  .field span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; }
  .field input {
    width: 100%; padding: 16px 16px 16px 46px; border-radius: 14px;
    border: 1px solid var(--border); background: rgba(0,0,0,.3);
    color: var(--text); font: inherit; font-size: 16px; outline: none; transition: .25s;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,229,255,.15); }
  .field input::placeholder { color: #5f7196; }
  button {
    padding: 0 28px; height: 54px; border: 0; border-radius: 14px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 16px; color: #06101f;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 8px 24px rgba(0,229,255,.3);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(168,85,247,.45); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .6; cursor: wait; }

  /* ===== Status ===== */
  #status { margin-top: 18px; min-height: 22px; font-size: 14px; }
  .err { color: #ff7b9c; }
  .loading { color: var(--accent); font-family: "JetBrains Mono", monospace; }
  .loading::after { content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Result ===== */
  #result { display: none; margin-top: 10px; }
  #result.show { display: block; animation: rise .6s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }

  .lokasi-title {
    font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px;
  }
  .lokasi-name { font-size: 28px; font-weight: 700; margin-bottom: 18px; word-break: break-word; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .item {
    padding: 16px; border-radius: 16px; border: 1px solid var(--border);
    background: rgba(255,255,255,.04); transition: .25s; position: relative; overflow: hidden;
    animation: rise .6s both;
  }
  .item:nth-child(1){animation-delay:.05s} .item:nth-child(2){animation-delay:.12s}
  .item:nth-child(3){animation-delay:.19s} .item:nth-child(4){animation-delay:.26s}
  .item:nth-child(5){animation-delay:.33s}
  .item:hover { transform: translateY(-4px); border-color: var(--accent); background: rgba(0,229,255,.07); }
  .item .ic { font-size: 22px; }
  .item .lb { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; }
  .item .vl { font-size: 19px; font-weight: 600; margin-top: 2px; word-break: break-word; }
  .item .vl.mono { font-family: "JetBrains Mono", monospace; color: var(--accent); }

  /* ===== Mini world map ===== */
  .map {
    position: relative; margin-top: 16px; height: 170px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--border);
    background:
      radial-gradient(circle at 50% 50%, rgba(0,229,255,.12), transparent 70%),
      linear-gradient(rgba(0,229,255,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,.12) 1px, transparent 1px),
      #060c1c;
    background-size: 100% 100%, 10% 16.66%, 10% 16.66%, 100% 100%;
  }
  .map .eq { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgba(255,255,255,.25); }
  .map .pm { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px dashed rgba(255,255,255,.25); }
  .map .tag { position: absolute; font-size: 10px; color: var(--muted); font-family: "JetBrains Mono", monospace; }
  .pin { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--accent3); transform: translate(-50%,-50%); transition: left .9s cubic-bezier(.3,1.3,.5,1), top .9s cubic-bezier(.3,1.3,.5,1); box-shadow: 0 0 14px var(--accent3); }
  .pin::before, .pin::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent3); animation: ping 1.8s infinite; }
  .pin::after { animation-delay: .9s; }
  @keyframes ping { to { transform: scale(4.5); opacity: 0; } }

  /* ===== Footer identitas ===== */
  .id-card {
    margin-top: 22px; display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    border-radius: 18px; border: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(12px);
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center;
    font-weight: 700; font-size: 18px; color: #06101f;
    background: linear-gradient(135deg, var(--accent3), var(--accent2));
  }
  .id-card .nm { font-weight: 700; font-size: 16px; }
  .id-card .nim { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--accent); }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <div class="wrap">
    <header>
      <span class="badge"><i class="dot"></i> MapTiler Geocoding API</span>
      <h1>Geo Locator</h1>
      <p>Cari lokasi apa aja, langsung dapet koordinat & wilayahnya 🛰️</p>
    </header>

    <div class="card">
      <div class="search">
        <div class="field">
          <span>📍</span>
          <input id="lokasi" type="text" placeholder="Contoh: Kasihan, Bantul" autocomplete="off" />
        </div>
        <button id="btn">Cari 🔎</button>
      </div>

      <div id="status"></div>

      <div id="result">
        <div class="lokasi-title">Lokasi</div>
        <div class="lokasi-name" id="rInput">-</div>

        <div class="grid">
          <div class="item"><div class="ic">🌏</div><div class="lb">Negara</div><div class="vl" id="rNegara">-</div></div>
          <div class="item"><div class="ic">🏛️</div><div class="lb">Provinsi</div><div class="vl" id="rProvinsi">-</div></div>
          <div class="item"><div class="ic">🏘️</div><div class="lb">Kecamatan</div><div class="vl" id="rKecamatan">-</div></div>
          <div class="item"><div class="ic">🧭</div><div class="lb">Longitude</div><div class="vl mono" id="rLong">-</div></div>
          <div class="item"><div class="ic">📐</div><div class="lb">Latitude</div><div class="vl mono" id="rLat">-</div></div>
        </div>

        <div class="map">
          <div class="eq"></div><div class="pm"></div>
          <span class="tag" style="left:6px;top:4px">90°N</span>
          <span class="tag" style="left:6px;bottom:4px">90°S</span>
          <span class="tag" style="right:6px;top:calc(50% + 3px)">0°</span>
          <div class="pin" id="pin" style="left:50%;top:50%"></div>
        </div>
      </div>
    </div>

    <div class="id-card">
      <div class="avatar">MR</div>
      <div>
        <div class="nm">Muhammad Rendra Ananditya</div>
        <div class="nim">NIM 20240140212</div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const input = $("lokasi"), btn = $("btn"), status = $("status"), result = $("result");

  async function cariLokasi() {
    const q = input.value.trim();
    result.classList.remove("show");

    if (!q) {
      status.innerHTML = '<span class="err">⚠️ Isi nama lokasi dulu ya!</span>';
      return;
    }

    status.innerHTML = '<span class="loading">Lagi nyari koordinat</span>';
    btn.disabled = true;

    try {
      const res = await fetch(`/api/lokasi?q=${encodeURIComponent(q)}`);
      const data = await res.json();

      if (!res.ok) throw new Error(data.message || "Terjadi kesalahan");

      const longitude = Number(data.longitude);
      const latitude = Number(data.latitude);

      if (!Number.isFinite(longitude) || !Number.isFinite(latitude)) {
        throw new Error("Data koordinat tidak valid");
      }

      $("rInput").textContent = data.input || q;
      $("rNegara").textContent = data.negara || "-";
      $("rProvinsi").textContent = data.provinsi || "-";
      $("rKecamatan").textContent = data.kecamatan || "-";
      $("rLong").textContent = longitude.toFixed(6);
      $("rLat").textContent = latitude.toFixed(6);

      // posisi pin di mini map (equirectangular)
      $("pin").style.left = ((longitude + 180) / 360) * 100 + "%";
      $("pin").style.top = ((90 - latitude) / 180) * 100 + "%";

      status.innerHTML = "";
      result.classList.add("show");
    } catch (err) {
      status.innerHTML = `<span class="err">❌ ${err.message}</span>`;
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", cariLokasi);
  input.addEventListener("keydown", (e) => e.key === "Enter" && cariLokasi());
</script>
</body>
</html>
